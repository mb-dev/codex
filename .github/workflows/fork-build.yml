name: fork-build

on:
  workflow_dispatch:
    inputs:
      official_release_tag:
        description: "Optional openai/codex release tag to mirror, such as rust-v0.137.0"
        required: false
        type: string
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  official-release:
    if: github.repository != 'openai/codex'
    name: Detect official release
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.detect.outputs.build_sha }}
      is_official_release: ${{ steps.detect.outputs.is_official_release }}
      official_release_url: ${{ steps.detect.outputs.official_release_url }}
      release_name: ${{ steps.detect.outputs.release_name }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      release_sha: ${{ steps.detect.outputs.release_sha }}
      release_prerelease: ${{ steps.detect.outputs.release_prerelease }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect matching official release
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_BRANCH_REF: ${{ github.ref_type == 'branch' }}
          REQUESTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.official_release_tag || '' }}
        run: |
          set -euo pipefail

          fork_releases_file="${RUNNER_TEMP}/fork-codex-releases.txt"
          tags_file="${RUNNER_TEMP}/openai-codex-tags.tsv"
          releases_file="${RUNNER_TEMP}/openai-codex-releases.tsv"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft | not) | .tag_name' \
            > "$fork_releases_file"
          git ls-remote --tags https://github.com/openai/codex.git 'refs/tags/rust-v*' > "$tags_file"
          gh api --paginate repos/openai/codex/releases \
            --jq '.[] | select(.draft | not) | [.tag_name, (.name // .tag_name), (.prerelease | tostring), .html_url] | @tsv' \
            > "$releases_file"

          python3 - "$tags_file" "$releases_file" "$fork_releases_file" <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import subprocess
          import sys

          tags_path, releases_path, fork_releases_path = sys.argv[1:]
          current_sha = os.environ["GITHUB_SHA"]
          is_branch_ref = os.environ.get("IS_BRANCH_REF") == "true"
          requested_tag = os.environ.get("REQUESTED_RELEASE_TAG", "").strip()

          peeled = {}
          unpeeled = {}
          with open(tags_path, encoding="utf-8") as tags_file:
              for line in tags_file:
                  sha, ref = line.rstrip("\n").split("\t", 1)
                  if not ref.startswith("refs/tags/"):
                      continue

                  tag = ref.removeprefix("refs/tags/")
                  if tag.endswith("^{}"):
                      peeled[tag.removesuffix("^{}")] = sha
                  else:
                      unpeeled[tag] = sha

          tag_shas = {
              tag: peeled.get(tag, sha)
              for tag, sha in unpeeled.items()
              if tag.startswith("rust-v")
          }

          releases = []
          with open(releases_path, encoding="utf-8") as releases_file:
              for line in releases_file:
                  tag, name, prerelease, url = line.rstrip("\n").split("\t", 3)
                  if not tag.startswith("rust-v"):
                      continue
                  release_sha = tag_shas.get(tag)
                  if release_sha is None:
                      continue
                  releases.append(
                      {
                          "tag": tag,
                          "name": name or tag,
                          "prerelease": prerelease,
                          "url": url,
                          "sha": release_sha,
                      }
                  )

          with open(fork_releases_path, encoding="utf-8") as fork_releases_file:
              fork_release_tags = {
                  line.strip()
                  for line in fork_releases_file
                  if line.strip()
              }

          selected = None
          if requested_tag:
              selected = next(
                  (release for release in releases if release["tag"] == requested_tag),
                  None,
              )
              if selected is None:
                  raise SystemExit(
                      f"{requested_tag} is not a published openai/codex rust release tag"
                  )
              if (
                  subprocess.run(
                      [
                          "git",
                          "merge-base",
                          "--is-ancestor",
                          selected["sha"],
                          current_sha,
                      ],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  ).returncode
                  != 0
              ):
                  raise SystemExit(
                      f"{requested_tag} resolves to {selected['sha']}, "
                      f"which is not an ancestor of fork build commit {current_sha}"
                  )
          else:
              selected = next(
                  (release for release in releases if release["sha"] == current_sha),
                  None,
              )
              if selected is None and is_branch_ref:
                  selected = next(
                      (
                          release
                          for release in releases
                          if release["tag"] not in fork_release_tags
                          and subprocess.run(
                              [
                                  "git",
                                  "merge-base",
                                  "--is-ancestor",
                                  release["sha"],
                                  current_sha,
                              ],
                              check=False,
                              stdout=subprocess.DEVNULL,
                              stderr=subprocess.DEVNULL,
                          ).returncode
                          == 0
                      ),
                      None,
                  )

          if selected is None:
              print(f"build_sha={current_sha}")
              print("is_official_release=false")
              print("release_tag=")
              print("release_name=")
              print("release_sha=")
              print("release_prerelease=false")
              print("official_release_url=")
          else:
              print(f"build_sha={current_sha}")
              print("is_official_release=true")
              print(f"release_tag={selected['tag']}")
              print(f"release_name={selected['name']}")
              print(f"release_sha={selected['sha']}")
              print(f"release_prerelease={selected['prerelease']}")
              print(f"official_release_url={selected['url']}")
          PY

      - name: Summarize release detection
        shell: bash
        env:
          IS_OFFICIAL_RELEASE: ${{ steps.detect.outputs.is_official_release }}
          RELEASE_TAG: ${{ steps.detect.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.detect.outputs.release_sha }}
          BUILD_SHA: ${{ steps.detect.outputs.build_sha }}
          OFFICIAL_RELEASE_URL: ${{ steps.detect.outputs.official_release_url }}
        run: |
          set -euo pipefail
          if [[ "$IS_OFFICIAL_RELEASE" == "true" ]]; then
            {
              echo "Official release: ${RELEASE_TAG}"
              echo "Official commit: ${RELEASE_SHA}"
              echo "Fork build commit: ${BUILD_SHA}"
              echo "Official URL: ${OFFICIAL_RELEASE_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No matching official openai/codex release for ${BUILD_SHA}; release publishing will be skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    if: github.repository != 'openai/codex'
    needs: official-release
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-xlarge
            target: aarch64-apple-darwin
            artifact_name: codex-aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact_name: codex-x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.official-release.outputs.build_sha }}
          persist-credentials: false

      - name: Print runner specs
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: $(uname -a)"
          echo "Target: ${{ matrix.target }}"
          echo "Build SHA: ${{ needs.official-release.outputs.build_sha }}"
          echo "Official release SHA: ${{ needs.official-release.outputs.release_sha }}"
          echo "Disk usage:"
          df -h .

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS archive tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi

      - name: Use hermetic Cargo home
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          APT_UPDATE_ARGS: "-y"
          APT_INSTALL_ARGS: "--no-install-recommends"
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd

      - name: Disable aws-lc jitter entropy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          binaries=(codex codex-responses-api-proxy)
          if [[ "$target" == *linux* ]]; then
            binaries+=(bwrap)
          fi

          build_args=()
          for binary in "${binaries[@]}"; do
            build_args+=(--bin "$binary")
          done

          cargo build --target "$target" --release --timings "${build_args[@]}"

      - name: Upload Cargo timings
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-fork-build-${{ matrix.target }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Stage binary archives
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          release_dir="target/${target}/release"
          dest="dist/${target}"
          mkdir -p "$dest"

          binaries=(codex codex-responses-api-proxy)
          if [[ "$target" == *linux* ]]; then
            binaries+=(bwrap)
          fi

          for binary in "${binaries[@]}"; do
            src="${release_dir}/${binary}"
            staged_name="${binary}-${target}"
            staged_path="${dest}/${staged_name}"
            if [[ ! -f "$src" ]]; then
              echo "Binary ${src} not found" >&2
              exit 1
            fi

            cp "$src" "$staged_path"
            tar -C "$dest" -czf "${staged_path}.tar.gz" "$staged_name"
            zstd -T0 -19 -f "$staged_path" -o "${staged_path}.zst"
            rm "$staged_path"
          done

      - name: Build Codex package archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$TARGET" \
            --bundle primary \
            --entrypoint-dir "target/${TARGET}/release" \
            --archive-dir "dist/${TARGET}"

      - name: Summarize artifacts
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          {
            echo "### ${target}"
            echo
            echo '```text'
            find "dist/${target}" -maxdepth 1 -type f -print | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: codex-rs/dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: >-
      github.repository != 'openai/codex' &&
      needs.official-release.outputs.is_official_release == 'true'
    needs:
      - official-release
      - build
    name: Publish ${{ needs.official-release.outputs.release_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-*
          path: release-assets
          merge-multiple: true

      - name: Create fork release tag
        shell: bash
        env:
          BUILD_SHA: ${{ needs.official-release.outputs.build_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.official-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.official-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          fork_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          existing_tag_commit="$(
            git ls-remote --tags "$fork_url" \
              "refs/tags/${RELEASE_TAG}" \
              "refs/tags/${RELEASE_TAG}^{}" |
              awk '
                $2 ~ /\^\{\}$/ { peeled = $1 }
                $2 !~ /\^\{\}$/ { unpeeled = $1 }
                END {
                  if (peeled != "") {
                    print peeled
                  } else {
                    print unpeeled
                  }
                }
              '
          )"

          if [[ -n "$existing_tag_commit" ]]; then
            if [[ "$existing_tag_commit" == "$BUILD_SHA" ]]; then
              exit 0
            fi
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Fork release ${RELEASE_TAG} already exists but its tag points to ${existing_tag_commit}, expected ${BUILD_SHA}" >&2
              exit 1
            fi
            echo "Retargeting unpublished fork tag ${RELEASE_TAG} from ${existing_tag_commit} to ${BUILD_SHA}."
          fi

          tag_dir="${RUNNER_TEMP}/fork-release-tag"
          git init "$tag_dir"
          git -C "$tag_dir" fetch --depth=1 --no-tags \
            "$fork_url" "$BUILD_SHA"
          git -C "$tag_dir" tag -f "$RELEASE_TAG" "$BUILD_SHA"

          push_args=()
          if [[ -n "$existing_tag_commit" ]]; then
            push_args+=(--force)
          fi
          git -C "$tag_dir" push "${push_args[@]}" "$fork_url" \
            "refs/tags/${RELEASE_TAG}"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_RELEASE_URL: ${{ needs.official-release.outputs.official_release_url }}
          RELEASE_NAME: ${{ needs.official-release.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ needs.official-release.outputs.release_prerelease }}
          RELEASE_SHA: ${{ needs.official-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.official-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          release_notes="${RUNNER_TEMP}/fork-release-notes.md"
          {
            printf 'Fork build for official openai/codex release [%s](%s).\n\n' \
              "$RELEASE_TAG" "$OFFICIAL_RELEASE_URL"
            printf 'Official release commit: %s\n' "$RELEASE_SHA"
            printf 'Fork build commit: %s\n' "$GITHUB_SHA"
            printf 'Workflow run: %s/%s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'These are unsigned fork builds for macOS arm64 and Linux x86_64 musl.\n'
          } > "$release_notes"

          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "$RELEASE_NAME"
            --notes-file "$release_notes"
            --verify-tag
          )
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
          else
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          fi

          mapfile -t assets < <(find release-assets -type f -print | sort)
          if ((${#assets[@]} == 0)); then
            echo "No release assets found" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
