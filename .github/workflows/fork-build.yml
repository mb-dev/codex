name: fork-build

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing fork tag to build & publish, such as rust-v0.142.4"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  resolve:
    if: github.repository != 'openai/codex'
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      build_ref: ${{ steps.vars.outputs.build_ref }}
      release_name: ${{ steps.vars.outputs.release_name }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
    steps:
      - name: Resolve release tag
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ -z "$tag" ]]; then
            echo "No tag to build" >&2
            exit 1
          fi
          case "$tag" in
            rust-v*) ;;
            *)
              echo "Tag '$tag' is not a rust-v* release tag" >&2
              exit 1
              ;;
          esac

          name="${tag#rust-v}"
          case "$tag" in
            *alpha* | *beta* | *rc*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          {
            echo "release_tag=$tag"
            echo "build_ref=$tag"
            echo "release_name=$name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          {
            echo "Release tag: ${tag}"
            echo "Release name: ${name}"
            echo "Prerelease: ${prerelease}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.repository != 'openai/codex'
    needs: resolve
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact_name: codex-aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact_name: codex-x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact_name: codex-aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.build_ref }}
          persist-credentials: false

      - name: Print runner specs
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME:-unknown}"
          echo "OS: $(uname -a)"
          echo "Target: ${{ matrix.target }}"
          echo "Build ref: ${{ needs.resolve.outputs.build_ref }}"
          echo "Disk usage:"
          df -h .

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS archive tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            brew install zstd
          fi

      - name: Use hermetic Cargo home
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          APT_UPDATE_ARGS: "-y"
          APT_INSTALL_ARGS: "--no-install-recommends"
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd

      - name: Configure Linux build resources
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

          echo "Memory before swap:"
          free -h
          echo "Disk before swap:"
          df -h /

          available_kb="$(df --output=avail / | tail -n 1)"
          if swapon --show=NAME --noheadings | grep -q .; then
            echo "Swap is already active; skipping swapfile creation."
          elif ((available_kb >= 6 * 1024 * 1024)); then
            sudo fallocate -l 4G /mnt/codex-swapfile
            sudo chmod 600 /mnt/codex-swapfile
            sudo mkswap /mnt/codex-swapfile
            sudo swapon /mnt/codex-swapfile
          else
            echo "Skipping swapfile; less than 6 GiB available on /"
          fi

          echo "Memory after swap:"
          free -h
          echo "Disk after swap:"
          df -h /

      - name: Disable aws-lc jitter entropy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build bwrap and export digest
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release --timings --bin bwrap

          bwrap_path="target/${target}/release/bwrap"
          if [[ ! -f "$bwrap_path" ]]; then
            echo "bwrap binary ${bwrap_path} not found" >&2
            exit 1
          fi

          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap ${bwrap_path} with sha256:${digest}"

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          binaries=(codex codex-code-mode-host)

          build_args=()
          for binary in "${binaries[@]}"; do
            build_args+=(--bin "$binary")
          done

          cargo build --target "$target" --release --timings "${build_args[@]}"

      - name: Upload Cargo timings
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-fork-build-${{ matrix.target }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Stage binary archives
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          release_dir="target/${target}/release"
          dest="dist/${target}"
          mkdir -p "$dest"

          binaries=(codex)
          if [[ "$target" == *linux* ]]; then
            binaries+=(bwrap)
          fi

          for binary in "${binaries[@]}"; do
            src="${release_dir}/${binary}"
            staged_name="${binary}-${target}"
            staged_path="${dest}/${staged_name}"
            if [[ ! -f "$src" ]]; then
              echo "Binary ${src} not found" >&2
              exit 1
            fi

            cp "$src" "$staged_path"
            tar -C "$dest" -czf "${staged_path}.tar.gz" "$staged_name"
            zstd -T0 -19 -f "$staged_path" -o "${staged_path}.zst"
            rm "$staged_path"
          done

      - name: Build Codex package archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CODEX_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$TARGET" \
            --bundle primary \
            --entrypoint-dir "target/${TARGET}/release" \
            --archive-dir "dist/${TARGET}"

      - name: Summarize artifacts
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          {
            echo "### ${target}"
            echo
            echo '```text'
            find "dist/${target}" -maxdepth 1 -type f -print | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: codex-rs/dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.repository != 'openai/codex'
    needs:
      - resolve
      - build
    name: Publish ${{ needs.resolve.outputs.release_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          BUILD_REF: ${{ needs.resolve.outputs.build_ref }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.resolve.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail

          release_notes="${RUNNER_TEMP}/fork-release-notes.md"
          {
            printf 'Fork build of openai/codex at tag `%s`.\n\n' "$RELEASE_TAG"
            printf 'Upstream release: %s/openai/codex/releases/tag/%s\n' \
              "$GITHUB_SERVER_URL" "$RELEASE_TAG"
            printf 'Workflow run: %s/%s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'These are unsigned Codex fork builds for macOS arm64 and Linux x86_64/aarch64 musl.\n'
          } > "$release_notes"

          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "$RELEASE_NAME"
            --notes-file "$release_notes"
            --verify-tag
          )
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${release_args[@]}"
          else
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          fi

          mapfile -t assets < <(find release-assets -type f -print | sort)
          if ((${#assets[@]} == 0)); then
            echo "No release assets found" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
